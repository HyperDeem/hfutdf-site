name: Deploy to CloudBase Static Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudbase-production-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Check build output
        run: test -s ./dist/index.html

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli

      - name: Login to CloudBase
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TCB_SECRET_ID" || -z "$TCB_SECRET_KEY" ]]; then
            echo "::error::Missing TCB_SECRET_ID or TCB_SECRET_KEY."
            exit 1
          fi
          # Do not expose authentication output or enable shell tracing.
          if ! tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY" >/dev/null 2>&1; then
            echo "::error::CloudBase login failed. Check Secrets and credential permissions."
            exit 1
          fi

      - name: Deploy dist to hosting root
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TCB_ENV_ID" ]]; then
            echo "::error::Missing TCB_ENV_ID."
            exit 1
          fi
          tcb hosting deploy ./dist / -e "$TCB_ENV_ID"
